name: Backup

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  dump:
    # Stays green (skipped) until the repository variable BACKUP_ENABLED is set to true.
    if: vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump database
        env:
          # Direct (non-pooled) connection: pg_dump does not work through a PgBouncer pooler.
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
        run: |
          stamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          pg_dump "$DATABASE_URL" --no-owner --no-privileges -Fc -f "obelisco-${stamp}.dump"
          echo "BACKUP_FILE=obelisco-${stamp}.dump" >> "$GITHUB_ENV"

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          aws s3 cp "$BACKUP_FILE" "s3://${{ secrets.R2_BUCKET }}/backups/$BACKUP_FILE" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

      - name: Keep the dump as a build artifact for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
