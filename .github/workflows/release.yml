name: Release

# A merge into main is a release. Versioning is derived from conventional commits since
# the last tag, so the number is never typed by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Calculate next version
        id: calc
        run: |
          set -euo pipefail
          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
          if [ -n "$last" ]; then
            echo "Ultimo tag: $last"
            # Si el tag ya apunta a este commit, el release existe: se reutiliza la
            # version. Sin esto, re-ejecutar el workflow inventaria v0.2.1 sin cambios.
            if [ "$(git rev-list -n1 "$last")" = "$(git rev-parse HEAD)" ]; then
              echo "Este commit ya esta taggeado: se reutiliza $last"
              version="$(python -m scripts.version --last-tag "$last" --head-already-tagged)"
            else
              git log "$last..HEAD" --format=%B > commits.txt
              version="$(python -m scripts.version --last-tag "$last" --commits-file commits.txt)"
            fi
          else
            echo "Sin tags previos: primer release"
            git log HEAD --format=%B > commits.txt
            version="$(python -m scripts.version --commits-file commits.txt)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Version calculada: $version"

  publish:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Un tag anotado necesita autor. El runner arranca sin identidad configurada y
          # `git tag -a` falla con "empty ident name".
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "El tag $TAG ya existe: se reutiliza"
          else
            git tag -a "$TAG" -m "Release $VERSION"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "El release $TAG ya existe: se reutiliza"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi

  deploy:
    needs: [version, publish]
    # Stays skipped (green) until the repository variable DEPLOY_ENABLED is true.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the released image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
            DJANGO_SUPERUSER_USERNAME=${{ secrets.DJANGO_SUPERUSER_USERNAME }}
            DJANGO_SUPERUSER_PASSWORD=${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
            DJANGO_SUPERUSER_EMAIL=${{ secrets.DJANGO_SUPERUSER_EMAIL }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE }}:latest

      - name: Validate the Google Cloud configuration
        # Un provider mal escrito produce "invalid audience", que no dice que esta mal.
        # Esto falla antes, con el formato esperado y como obtenerlo.
        env:
          WIF: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -eu
          esperado='projects/<NUMERO>/locations/global/workloadIdentityPools/<POOL>/providers/<PROVIDER>'
          if [ -z "${PROJECT:-}" ]; then
            echo "::error::Falta la variable de repositorio GCP_PROJECT_ID (el ID del proyecto, no el nombre)."
            exit 1
          fi
          if ! printf '%s' "$WIF" | grep -Eq '^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$'; then
            echo "::error::GCP_WORKLOAD_IDENTITY_PROVIDER no tiene el formato esperado: $esperado"
            echo "Valor recibido (largo ${#WIF}, primeras 12 letras): $(printf '%s' "$WIF" | cut -c1-12)..."
            echo "Se obtiene con:"
            echo "  gcloud iam workload-identity-pools providers describe <PROVIDER> \\"
            echo "    --project=<PROJECT_ID> --location=global \\"
            echo "    --workload-identity-pool=<POOL> --format='value(name)'"
            echo "Ojo: usa el NUMERO del proyecto, no el ID."
            exit 1
          fi
          # Esta confundido de secret produce "Unable to acquire impersonated
          # credentials", que no dice nada. La cuenta es un EMAIL, no una ruta.
          if ! printf '%s' "${SA:-}" | grep -Eq '^[a-zA-Z0-9._-]+@[a-z0-9-]+\.iam\.gserviceaccount\.com$'; then
            echo "::error::GCP_SERVICE_ACCOUNT tiene que ser el email de la cuenta."
            echo "Se espera algo como: obelisco-deploy@<PROYECTO>.iam.gserviceaccount.com"
            echo "Se recibio algo de ${#SA} caracteres que empieza con: $(printf '%s' "${SA:-}" | cut -c1-16)..."
            echo "Si empieza con 'projects/', se pego la ruta del pool por error."
            exit 1
          fi
          echo "Provider con formato valido y cuenta $SA"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Diagnosticar la cuenta impersonada
        # La direccion de impersonacion vive en el archivo de credenciales. Verla dice
        # exactamente que cuenta se esta usando, que es lo que no se puede adivinar
        # porque los secrets estan enmascarados en los logs.
        run: |
          archivo="${GOOGLE_GHA_CREDS_PATH:-${GOOGLE_APPLICATION_CREDENTIALS:-}}"
          echo "archivo: ${archivo:-ninguno}"
          python3 - "${archivo}" <<'PY'
          import json
          import sys

          ruta = sys.argv[1]
          if not ruta or not ruta.endswith(".json"):
              print("sin archivo de credenciales en el entorno")
              raise SystemExit(0)
          datos = json.load(open(ruta, encoding="utf-8"))
          print("tipo          :", datos.get("type"))
          import re

          url = datos.get("service_account_impersonation_url") or ""
          encontrado = re.search(r"serviceAccounts/([^:]+):", url)
          if encontrado:
              correo = encontrado.group(1)
              # Un fragmento no coincide con el valor del secret, asi que GitHub no lo
              # enmascara: alcanza para comparar sin exponer la cuenta.
              print("cuenta        :", correo[:12] + "..." + correo[-26:])
              print("largo         :", len(correo))
              print("esperada      : obelisco-dep...count@sistemaobelisco.iam.gserviceaccount.com")
          else:
              print("cuenta        : no se pudo leer la direccion")
          entrada = datos.get("credential_source", {}).get("url", "(sin source)")
          print("origen        :", entrada)
          PY

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          # Sin esto el action vuelve en cuanto crea la revision, aunque el contenedor
          # no arranque: un deploy "exitoso" que no sirve nada.
          wait: true
          # Cloud Run crea los servicios pidiendo autenticacion. El catalogo es publico
          # y /health/ tiene que responder sin credenciales.
          flags: --allow-unauthenticated
          service: obelisco
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
          env_vars: |
            APP_VERSION=${{ needs.version.outputs.version }}
            DJANGO_SUPERUSER_USERNAME=${{ secrets.DJANGO_SUPERUSER_USERNAME }}
            DJANGO_SUPERUSER_PASSWORD=${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
            DJANGO_SUPERUSER_EMAIL=${{ secrets.DJANGO_SUPERUSER_EMAIL }}
            SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
            CSRF_TRUSTED_ORIGINS=${{ secrets.CSRF_TRUSTED_ORIGINS }}
            R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            R2_BUCKET=${{ secrets.R2_BUCKET }}
            AWS_ENDPOINT_URL_S3=${{ secrets.AWS_ENDPOINT_URL_S3 }}
            AWS_STORAGE_BUCKET_NAME=${{ secrets.AWS_STORAGE_BUCKET_NAME }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}

      - name: Publicar la URL del servicio
        run: |
          url="${{ steps.deploy.outputs.url }}"
          echo "Servicio desplegado: $url"
          echo "### Desplegado en $url" >> "$GITHUB_STEP_SUMMARY"
          version="$(curl -sS -m 20 "$url/health/")" && echo "Health: $version"
          echo "$version" | grep -q '"status": *"ok"' || {
            echo "::error::El servicio responde pero /health/ no esta ok: $version"
            exit 1
          }

      - name: Registrar la URL en el release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # El log de Actions enmascara la URL del servicio, asi que no queda consultable
          # desde ahi. El release es el lugar donde vive el link de produccion.
          url="${{ steps.deploy.outputs.url }}"
          gh release view "$TAG" --json body --jq .body > notas.md
          printf '\n**Produccion:** %s\n' "$url" >> notas.md
          gh release edit "$TAG" --notes-file notas.md
