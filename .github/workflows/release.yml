name: Release

# A merge into main is a release. Versioning is derived from conventional commits since
# the last tag, so the number is never typed by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Calculate next version
        id: calc
        run: |
          set -euo pipefail
          last="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
          if [ -n "$last" ]; then
            echo "Ultimo tag: $last"
            # Si el tag ya apunta a este commit, el release existe: se reutiliza la
            # version. Sin esto, re-ejecutar el workflow inventaria v0.2.1 sin cambios.
            if [ "$(git rev-list -n1 "$last")" = "$(git rev-parse HEAD)" ]; then
              echo "Este commit ya esta taggeado: se reutiliza $last"
              version="$(python -m scripts.version --last-tag "$last" --head-already-tagged)"
            else
              git log "$last..HEAD" --format=%B > commits.txt
              version="$(python -m scripts.version --last-tag "$last" --commits-file commits.txt)"
            fi
          else
            echo "Sin tags previos: primer release"
            git log HEAD --format=%B > commits.txt
            version="$(python -m scripts.version --commits-file commits.txt)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Version calculada: $version"

  publish:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Un tag anotado necesita autor. El runner arranca sin identidad configurada y
          # `git tag -a` falla con "empty ident name".
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "El tag $TAG ya existe: se reutiliza"
          else
            git tag -a "$TAG" -m "Release $VERSION"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "El release $TAG ya existe: se reutiliza"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi

  deploy:
    needs: [version, publish]
    # Stays skipped (green) until the repository variable DEPLOY_ENABLED is true.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the released image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE }}:latest

      - name: Validate the Google Cloud configuration
        # Un provider mal escrito produce "invalid audience", que no dice que esta mal.
        # Esto falla antes, con el formato esperado y como obtenerlo.
        env:
          WIF: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -eu
          esperado='projects/<NUMERO>/locations/global/workloadIdentityPools/<POOL>/providers/<PROVIDER>'
          if [ -z "${PROJECT:-}" ]; then
            echo "::error::Falta la variable de repositorio GCP_PROJECT_ID (el ID del proyecto, no el nombre)."
            exit 1
          fi
          if ! printf '%s' "$WIF" | grep -Eq '^projects/[0-9]+/locations/global/workloadIdentityPools/[^/]+/providers/[^/]+$'; then
            echo "::error::GCP_WORKLOAD_IDENTITY_PROVIDER no tiene el formato esperado: $esperado"
            echo "Valor recibido (largo ${#WIF}, primeras 12 letras): $(printf '%s' "$WIF" | cut -c1-12)..."
            echo "Se obtiene con:"
            echo "  gcloud iam workload-identity-pools providers describe <PROVIDER> \\"
            echo "    --project=<PROJECT_ID> --location=global \\"
            echo "    --workload-identity-pool=<POOL> --format='value(name)'"
            echo "Ojo: usa el NUMERO del proyecto, no el ID."
            exit 1
          fi
          echo "Provider con formato valido, proyecto $PROJECT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Verify service account impersonation
        # Autenticarse no alcanza: la identidad federada tiene que poder IMPERSONAR la
        # cuenta de servicio. Sin el binding iam.workloadIdentityUser, el paso de auth
        # pasa y el fallo aparece despues, al refrescar el token.
        run: |
          set -eu
          if token="$(gcloud auth print-access-token 2>&1)"; then
            echo "Impersonacion OK (token de ${#token} caracteres)"
          else
            echo "::error::La identidad federada no puede impersonar la service account."
            echo "Falta este binding:"
            echo "  gcloud iam service-accounts add-iam-policy-binding <SERVICE_ACCOUNT> \\"
            echo "    --role=roles/iam.workloadIdentityUser \\"
            echo "    --member='principalSet://iam.googleapis.com/<PROJECT_NUMBER>/locations/global/workloadIdentityPools/<POOL>/attribute.repository/BlancoCavallero/SistemaObelisco'"
            echo "Salida de gcloud:"
            echo "$token"
            exit 1
          fi

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: obelisco
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
          env_vars: |
            APP_VERSION=${{ needs.version.outputs.version }}
            SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
            CSRF_TRUSTED_ORIGINS=${{ secrets.CSRF_TRUSTED_ORIGINS }}
            R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            R2_BUCKET=${{ secrets.R2_BUCKET }}
            AWS_ENDPOINT_URL_S3=${{ secrets.AWS_ENDPOINT_URL_S3 }}
            AWS_STORAGE_BUCKET_NAME=${{ secrets.AWS_STORAGE_BUCKET_NAME }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}
